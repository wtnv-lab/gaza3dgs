<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gaza 3D Digital Archives | A UTokyo & Partners Initiative</title>
    <meta name="description"
        content="An interactive 3D digital archive documenting the reality in Gaza, including scenes from Al Shifa Hospital and Khan Yunis. Created by the University of Tokyo and partners based on footage from Al Jazeera and UNRWA.">
    <meta property="og:title" content="Gaza 3D Digital Archives | Witnessing Reality">
    <meta property="og:description"
        content="An interactive 3D archive of scenes from Gaza, created from Al Jazeera and UNRWA footage to preserve and convey the situation on the ground.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://gaza.archiving.jp/sns.jpg">
    <meta property="og:url" content="https://gaza.archiving.jp/index.html">
    <meta property="og:site_name" content="Gaza 3D Digital Archives">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@hwtnv">
    <meta name="twitter:creator" content="@hwtnv">
    <meta name="twitter:title" content="Gaza 3D Digital Archives | A UTokyo & Partners Initiative">
    <meta name="twitter:description"
        content="An interactive 3D archive of scenes from Gaza, created from Al Jazeera and UNRWA footage to preserve and convey the situation on the ground.">
    <meta name="twitter:image" content="https://gaza.archiving.jp/sns.jpg">
    <script>
        if (new URLSearchParams(window.location.search).get("lg") === "1") {
            document.documentElement.classList.add("large-display-mode");
        }
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js",
            "fflate": "https://unpkg.com/fflate@0.8.2/esm/browser.js"
        }
    }
    </script>
    <link rel="stylesheet" href="./css/index.css?v=20260812-lg1">
</head>

<body>
    <a class="archives-index-link" href="https://all.archiving.jp/" target="_blank" rel="noopener noreferrer"
        aria-label="Archives Index">
        <span>Archives Index</span>
    </a>
    <div class="app-container">
        <div class="viewer-wrapper">
            <div id="content-host">
                <div id="iframe-target"></div>
                <div id="viewer-target"></div>
                <div id="viewer-loader">
                    <div class="viewer-loader-card">
                        <div class="viewer-loader-text" id="viewer-loader-text">Loading...</div>
                        <div class="viewer-loader-bar">
                            <div class="viewer-loader-fill" id="viewer-loader-fill"></div>
                        </div>
                        <div class="viewer-loader-progress" id="viewer-loader-progress">0%</div>
                    </div>
                </div>
            </div>
            <div id="info-box">
                <h3 id="info-title"></h3>
                <p id="info-description"></p>
                <div id="credit-display"></div>
            </div>
            <div class="large-display-credit large-display-credit-ja" lang="ja">
                <div class="large-display-credit-title">ガザ3Dデジタルアーカイブ</div>
                <p class="large-display-credit-subtitle">東京大学・協力機関による取り組み</p>
                <p class="large-display-credit-partner" id="large-display-credit-partner-ja"></p>
            </div>
            <div class="large-display-credit large-display-credit-en" lang="en">
                <div class="large-display-credit-title">Gaza 3D Digital Archives</div>
                <p class="large-display-credit-subtitle">A UTokyo & Partners Initiative</p>
                <p class="large-display-credit-partner" id="large-display-credit-partner-en"></p>
            </div>
            <aside class="large-display-description large-display-description-ja" lang="ja" aria-live="polite">
                <h2 id="large-scene-title-ja"></h2>
                <p id="large-scene-description-ja"></p>
            </aside>
            <aside class="large-display-description large-display-description-en" lang="en" aria-live="polite">
                <h2 id="large-scene-title-en"></h2>
                <p id="large-scene-description-en"></p>
            </aside>
            <a class="large-display-qr" id="large-display-qr" href="./" aria-label="Open this scene on a smartphone">
                <img id="large-display-qr-image" alt="" aria-hidden="true">
            </a>
            <div id="overlay-buttons" class="mobile-ui">
                <button id="info-toggle-btn" title="Info"><svg viewBox="0 0 24 24" class="icon">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg></button>
                <button id="fullscreen-btn" title="Fullscreen"><svg viewBox="0 0 24 24" class="icon">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                        </path>
                    </svg></button>
            </div>
        </div>
        <div id="desktop-scene-menu-wrap">
            <button id="desktop-scene-menu-toggle" type="button" aria-expanded="false" aria-controls="desktop-scene-menu">
                Contents
            </button>
            <aside id="desktop-scene-menu" aria-label="Contents list" hidden>
                <div id="desktop-scene-menu-list"></div>
            </aside>
        </div>
        <div id="controls">
            <button id="prev-btn" title="Previous (Left Arrow)"><svg viewBox="0 0 24 24" class="icon">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg></button>
            <div id="content-buttons-wrapper"></div>
            <button id="next-btn" title="Next (Right Arrow)"><svg viewBox="0 0 24 24" class="icon">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg></button>
        </div>
        <div id="playback-controls">
            <button id="playback-toggle" type="button" aria-label="Pause">❚❚</button>
            <input id="playback-slider" type="range" min="0" max="1" step="0.0001" value="0"
                aria-label="Playback progress">
        </div>
        <div id="mobile-controls" class="mobile-ui">
            <button id="mobile-prev" class="mobile-ui"><svg viewBox="0 0 24 24" class="icon">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg></button>
            <div id="mobile-center-controls" class="mobile-ui">
                <span id="scene-counter"></span>
                <button id="list-toggle-btn" title="Show List"><svg viewBox="0 0 24 24" class="icon">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg></button>
            </div>
            <button id="mobile-next" class="mobile-ui"><svg viewBox="0 0 24 24" class="icon">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg></button>
        </div>
    </div>
    <div id="list-modal">
        <div id="list-modal-header">
            <button id="list-modal-close"><svg viewBox="0 0 24 24" class="icon">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg></button>
        </div>
        <div id="list-modal-content"></div>
    </div>

    <script type="module" src="./js/index.js?v=20260812-ja-copy"></script>
</body>

</html>
